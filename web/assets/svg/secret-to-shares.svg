<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="100%"
     stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>chela split and recover</title>
  <desc>A secret enters a split node, fans out into five numbered shares, and any three of those shares feed a combine node that reconstructs the original secret.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>

  <!-- Secret box -->
  <rect x="20" y="100" width="100" height="40" rx="6" stroke-width="1.5"/>
  <text x="70" y="124" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13">secret</text>

  <!-- Arrow: secret → split -->
  <line x1="120" y1="120" x2="153" y2="120" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Split circle -->
  <circle cx="178" cy="120" r="22" stroke-width="1.5"/>
  <text x="178" y="155" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">split</text>

  <!-- Share cards: y positions for 5 cards spaced over ~200px vertically centered at y=120 -->
  <!-- shares at x=290: y centers = 30, 75, 120, 165, 210 -->
  <!-- Fan-out arrows from split circle to each card -->

  <!-- Share 1 (y=10) -->
  <line x1="198" y1="113" x2="282" y2="23" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="285" y="5" width="50" height="36" rx="4" stroke-width="1.5"/>
  <text x="310" y="28" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Share 1</text>

  <!-- Share 2 (y=65) -->
  <line x1="199" y1="116" x2="282" y2="70" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="285" y="52" width="50" height="36" rx="4" stroke-width="1.5"/>
  <text x="310" y="75" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Share 2</text>

  <!-- Share 3 (y=102) -->
  <line x1="200" y1="120" x2="282" y2="120" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="285" y="102" width="50" height="36" rx="4" stroke-width="1.5"/>
  <text x="310" y="125" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Share 3</text>

  <!-- Share 4 (y=152) -->
  <line x1="199" y1="124" x2="282" y2="166" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="285" y="152" width="50" height="36" rx="4" stroke-width="1.5"/>
  <text x="310" y="175" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Share 4</text>

  <!-- Share 5 (y=202) -->
  <line x1="198" y1="127" x2="282" y2="213" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="285" y="199" width="50" height="36" rx="4" stroke-width="1.5"/>
  <text x="310" y="222" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Share 5</text>

  <!-- "any 3" label -->
  <text x="420" y="12" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" opacity="0.7">any 3 of 5</text>

  <!-- Converging arrows: shares 1, 3, 5 → combine -->
  <!-- Share 1 center: 310, 23 → combine at 538, 120 -->
  <line x1="335" y1="23" x2="514" y2="110" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Share 3 center: 310, 120 → combine -->
  <line x1="335" y1="120" x2="513" y2="120" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Share 5 center: 310, 217 → combine -->
  <line x1="335" y1="217" x2="514" y2="130" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Combine circle -->
  <circle cx="538" cy="120" r="22" stroke-width="1.5"/>
  <text x="538" y="155" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">combine</text>

  <!-- Arrow: combine → recovered secret -->
  <line x1="560" y1="120" x2="615" y2="120" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Recovered secret box -->
  <rect x="618" y="100" width="82" height="40" rx="6" stroke-width="1.5"/>
  <text x="659" y="118" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="10">secret</text>
  <text x="659" y="132" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">(recovered)</text>
</svg>
