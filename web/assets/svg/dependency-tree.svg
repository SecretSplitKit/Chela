<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="100%"
     stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>chela workspace dependency tree</title>
  <desc>Top-down tree showing how chela's crates depend on each other: chela-field and chela-primitives are the roots with no dependencies of their own; chela-sss builds on both and chela-bip39 builds on chela-primitives; those converge into chela-engine, then chela-share, then the three front-ends chela-tui, chela-cli, and chela-wasm; chela-bundle embeds the compiled chela-wasm at build time.</desc>

  <!--
    Layout (box w=150, h=36, center-x, center-y):
    Row 1 (y=40):  chela-field cx=140, chela-primitives cx=320
    Row 2 (y=120): chela-sss cx=220, chela-bip39 cx=440
    Row 3 (y=200): chela-engine       cx=320
    Row 4 (y=280): chela-share        cx=320
    Row 5 (y=360): chela-tui cx=140, chela-cli cx=320, chela-wasm cx=500
    Row 6 (y=430): chela-bundle       cx=500
  -->

  <!-- Row 1: chela-field and chela-primitives (no dependencies) -->
  <rect x="65" y="22" width="150" height="36" rx="5" stroke-width="1.5"/>
  <text x="140" y="44" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12">chela-field</text>

  <rect x="245" y="22" width="150" height="36" rx="5" stroke-width="1.5"/>
  <text x="320" y="44" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12">chela-primitives</text>

  <!-- field → sss (diagonal right) -->
  <line x1="160" y1="58" x2="200" y2="102" stroke-width="1.5"/>
  <!-- primitives → sss (diagonal left) -->
  <line x1="290" y1="58" x2="250" y2="102" stroke-width="1.5"/>
  <!-- primitives → bip39 (diagonal right) -->
  <line x1="350" y1="58" x2="410" y2="102" stroke-width="1.5"/>

  <!-- Row 2: chela-sss and chela-bip39 -->
  <rect x="145" y="102" width="150" height="36" rx="5" stroke-width="1.5"/>
  <text x="220" y="124" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12">chela-sss</text>

  <rect x="365" y="102" width="150" height="36" rx="5" stroke-width="1.5"/>
  <text x="440" y="124" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12">chela-bip39</text>

  <!-- sss → engine (diagonal right) -->
  <line x1="255" y1="138" x2="305" y2="182" stroke-width="1.5"/>
  <!-- bip39 → engine (diagonal left) -->
  <line x1="405" y1="138" x2="355" y2="182" stroke-width="1.5"/>

  <!-- Row 3: chela-engine -->
  <rect x="245" y="182" width="150" height="36" rx="5" stroke-width="1.5"/>
  <text x="320" y="204" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12">chela-engine</text>

  <!-- engine → share -->
  <line x1="320" y1="218" x2="320" y2="262" stroke-width="1.5"/>

  <!-- Row 4: chela-share -->
  <rect x="245" y="262" width="150" height="36" rx="5" stroke-width="1.5"/>
  <text x="320" y="284" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12">chela-share</text>

  <!-- share → tui (far left) -->
  <line x1="276" y1="298" x2="175" y2="342" stroke-width="1.5"/>
  <!-- share → cli (center) -->
  <line x1="320" y1="298" x2="320" y2="342" stroke-width="1.5"/>
  <!-- share → wasm (far right) -->
  <line x1="364" y1="298" x2="465" y2="342" stroke-width="1.5"/>

  <!-- Row 5: chela-tui, chela-cli, chela-wasm -->
  <rect x="65" y="342" width="150" height="36" rx="5" stroke-width="1.5"/>
  <text x="140" y="364" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12">chela-tui</text>

  <rect x="245" y="342" width="150" height="36" rx="5" stroke-width="1.5"/>
  <text x="320" y="364" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12">chela-cli</text>

  <rect x="425" y="342" width="150" height="36" rx="5" stroke-width="1.5"/>
  <text x="500" y="364" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12">chela-wasm</text>

  <!-- wasm → bundle (build-time: build.rs compiles and embeds chela-wasm) -->
  <line x1="500" y1="378" x2="500" y2="412" stroke-width="1.5"/>

  <!-- Row 6: chela-bundle -->
  <rect x="425" y="412" width="150" height="36" rx="5" stroke-width="1.5"/>
  <text x="500" y="434" text-anchor="middle" fill="currentColor" stroke="none"
        font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12">chela-bundle</text>
</svg>
