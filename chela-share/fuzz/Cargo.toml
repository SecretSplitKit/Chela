# chela-share fuzz target.
#
# Standalone crate (not part of the main workspace; see the parent Cargo.toml's
# `exclude` line). The lone third-party dependency is `libfuzzer-sys`, which is what
# `cargo fuzz` requires to drive libFuzzer. It never appears in any release binary
# — this crate is only built during local fuzzing or in the dedicated fuzz CI job.
#
# Usage:
#   cargo install cargo-fuzz
#   cd chela-share/fuzz
#   cargo +nightly fuzz run parse_shares     # or: extract_html / extract_json
#
# A longer-running (hours / overnight) fuzz pass belongs in the pre-release checklist.

[package]
name = "chela-share-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Empty [workspace] table makes this its own workspace root. Necessary because Cargo's
# workspace-discovery algorithm walks upward looking for a workspace manifest, and
# we want the fuzz crate to be entirely standalone (the parent workspace explicitly
# excludes us; this is the other half of that contract).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
chela-share = { path = ".." }

[[bin]]
name = "parse_shares"
path = "fuzz_targets/parse_shares.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract_html"
path = "fuzz_targets/extract_html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract_json"
path = "fuzz_targets/extract_json.rs"
test = false
doc = false
bench = false
