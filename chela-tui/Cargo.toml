[package]
name = "chela-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wizard-style terminal UI for chela. Hand-rolled raw-mode + ANSI rendering, no external terminal-library dependencies."

[[bin]]
name = "chela"
path = "src/main.rs"

[dependencies]
