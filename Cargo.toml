# chela workspace manifest. See AGENTS.md for the architectural overview.

[workspace]
resolver = "2"
members = [
    "chela-primitives",
    "chela-field",
    "chela-sss",
    "chela-bip39",
    "chela-share",
    "chela-engine",
    "chela-tui",
    "chela-cli",
    "chela-wasm",
    "chela-serve",
]
# chela-share/fuzz is its own little workspace — it depends on libfuzzer-sys, which
# is the *only* third-party crate anywhere in this repo. It's a test harness, never
# shipped or linked into a release binary, but we still keep it out of the main
# workspace so a stray `cargo build --workspace` doesn't pull libfuzzer-sys in.
exclude = ["chela-share/fuzz"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SecretSplitKit/Chela"
rust-version = "1.89"

[workspace.lints.rust]
# Workspace default: deny `unsafe`. Crates that genuinely need it (chela-primitives for
# OS RNG syscalls and volatile zeroize) opt in at the module level with a documented
# `#[allow(unsafe_code)]`. All other crates pin this to `forbid` in their own lib.rs.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Trade-offs we accept for readability in crypto code:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# Release profile: tuned for reproducibility and audit-friendliness. The release CI
# verifies that two independent builds produce byte-identical artifacts and signs each
# one with minisign; the settings below remove the obvious sources of build-to-build
# non-determinism in Rust output. Per-target linker flags that strip platform-specific
# nondeterministic blobs (Mach-O UUID, ELF build-id, PE timestamp) live in the release
# workflow as RUSTFLAGS so they only apply to the published artifacts.
[profile.release]
strip = "symbols"
debug = false
incremental = false
codegen-units = 1
lto = "thin"
overflow-checks = true
# `panic` is left at the default (`unwind`) deliberately: aborting on panic would skip
# Drop, including the `SecretString` zeroize destructor in chela-tui. With unwind, a
# panic still wipes secret-bearing buffers before the process exits.
