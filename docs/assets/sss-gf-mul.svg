<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 292" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Multiply by x in GF(2 to the 8): shift left, then fold the overflow back in with 0x1b">
<title>Multiply by x in GF(2 to the 8): shift left, then fold the overflow back in with 0x1b</title>
