<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 290" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Irreducible polynomials are the primes of polynomial arithmetic: they cannot be factored">
<title>Irreducible polynomials are the primes of polynomial arithmetic: they cannot be factored</title>
<rect x="0.5" y="0.5" width="623" height="289" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="28" y="34" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="start" >Step 3 — irreducible polynomials are the “primes”</text>
<text x="70" y="66" fill="#94a3b8" font-size="12" font-weight="700" font-style="normal" text-anchor="start" >ordinary numbers</text>
<text x="340" y="66" fill="#94a3b8" font-size="12" font-weight="700" font-style="normal" text-anchor="start" >polynomials over GF(2)</text>
<line x1="318" y1="54" x2="318" y2="250" stroke="#e5e7eb" stroke-width="1.4"/>
<rect x="70" y="84" width="250" height="52" rx="7" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.3"/>
<text x="84" y="106" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">15 = 3 × 5</text>
<text x="84" y="126" fill="#e11d48" font-size="11.5" font-weight="600" font-style="normal" text-anchor="start" >composite — it splits</text>
<rect x="340" y="84" width="250" height="52" rx="7" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.3"/>
<text x="354" y="106" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">x²+1 = (x+1)(x+1)</text>
<text x="354" y="126" fill="#e11d48" font-size="11.5" font-weight="600" font-style="normal" text-anchor="start" >reducible — it splits</text>
<rect x="70" y="150" width="250" height="52" rx="7" fill="#d1fae5" stroke="#a7f3d0" stroke-width="1.3"/>
<text x="84" y="172" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">7  (prime)</text>
<text x="84" y="192" fill="#059669" font-size="11.5" font-weight="600" font-style="normal" text-anchor="start" >no smaller factors</text>
<rect x="340" y="150" width="250" height="52" rx="7" fill="#d1fae5" stroke="#a7f3d0" stroke-width="1.3"/>
<text x="354" y="172" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">x²+x+1  (irreducible)</text>
<text x="354" y="192" fill="#059669" font-size="11.5" font-weight="600" font-style="normal" text-anchor="start" >can't be factored</text>
<rect x="70" y="220" width="520" height="46" rx="7" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.3"/>
<text x="84" y="240" fill="#334155" font-size="12.5" font-weight="600" font-style="normal" text-anchor="start" >Chela's modulus  0x11b = x⁸+x⁴+x³+x+1  is irreducible —</text>
<text x="84" y="258" fill="#7c3aed" font-size="12.5" font-weight="700" font-style="normal" text-anchor="start" >the “prime” that turns the 256 bytes into a field.</text>
</svg>
