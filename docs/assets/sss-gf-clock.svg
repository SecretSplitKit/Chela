<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 332" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Clock arithmetic GF(7): addition wraps at 7 and every nonzero value has a multiplicative inverse">
<title>Clock arithmetic GF(7): addition wraps at 7 and every nonzero value has a multiplicative inverse</title>
<rect x="0.5" y="0.5" width="623" height="331" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="start" >Step 1 — clock arithmetic, GF(p): wrap at a prime p</text>
<circle cx="158" cy="196" r="104" fill="none" stroke="#e5e7eb" stroke-width="2"/>
<line x1="61.3" y1="198.7" x2="70.9" y2="156.5" stroke="#d97706" stroke-width="2.4" marker-end="url(#ah)"/>
<line x1="95.6" y1="122.0" x2="134.6" y2="103.3" stroke="#d97706" stroke-width="2.4" marker-end="url(#ah)"/>
<line x1="176.9" y1="101.1" x2="215.9" y2="119.9" stroke="#d97706" stroke-width="2.4" marker-end="url(#ah)"/>
<line x1="244.0" y1="151.6" x2="253.6" y2="193.8" stroke="#d97706" stroke-width="2.4" marker-end="url(#ah)"/>
<circle cx="158.0" cy="92.0" r="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="158.0" y="97.0" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" >0</text>
<circle cx="239.3" cy="131.2" r="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="239.3104741766751" y="136.15706060669172" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" >1</text>
<circle cx="259.4" cy="219.1" r="17" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="259.39250286690964" y="224.14217713145672" fill="#059669" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" >2</text>
<circle cx="203.1" cy="289.7" r="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="203.12390886822607" y="294.7007622618516" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" >3</text>
<circle cx="112.9" cy="289.7" r="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="112.87609113177396" y="294.7007622618516" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" >4</text>
<circle cx="56.6" cy="219.1" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="56.607497133090334" y="224.14217713145666" fill="#2563eb" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" >5</text>
<circle cx="76.7" cy="131.2" r="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="76.68952582332489" y="136.15706060669174" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" >6</text>
<text x="158" y="190" fill="#2563eb" font-size="11" font-weight="700" font-style="normal" text-anchor="middle" >start 5</text>
<text x="158" y="208" fill="#d97706" font-size="11" font-weight="600" font-style="normal" text-anchor="middle" >+4 steps</text>
<text x="158" y="226" fill="#059669" font-size="11" font-weight="700" font-style="normal" text-anchor="middle" >land on 2</text>
<text x="158" y="334" fill="#334155" font-size="13" font-weight="700" font-style="normal" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">5 + 4 = 9 = 2   (mod 7)</text>
<text x="340" y="80" fill="#334155" font-size="12.5" font-weight="700" font-style="normal" text-anchor="start" >Division works: every nonzero value</text>
<text x="340" y="98" fill="#334155" font-size="12.5" font-weight="700" font-style="normal" text-anchor="start" >has a × partner that gives 1 (mod 7):</text>
<rect x="340" y="120" width="120" height="28" rx="5" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="350" y="139" fill="#334155" font-size="13" font-weight="600" font-style="normal" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1 × 1 = 1</text>
<rect x="472" y="120" width="120" height="28" rx="5" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="482" y="139" fill="#334155" font-size="13" font-weight="600" font-style="normal" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2 × 4 = 1</text>
<rect x="340" y="158" width="120" height="28" rx="5" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="350" y="177" fill="#334155" font-size="13" font-weight="600" font-style="normal" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">3 × 5 = 1</text>
<rect x="472" y="158" width="120" height="28" rx="5" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="482" y="177" fill="#334155" font-size="13" font-weight="600" font-style="normal" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">6 × 6 = 1</text>
<text x="340" y="210" fill="#059669" font-size="12.5" font-weight="700" font-style="normal" text-anchor="start" >so "÷3" just means "×5"</text>
<rect x="340" y="226" width="256" height="72" rx="7" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.3"/>
<text x="352" y="248" fill="#e11d48" font-size="12.5" font-weight="700" font-style="normal" text-anchor="start" >Needs p prime.</text>
<text x="352" y="267" fill="#e11d48" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" >On a 6-clock, 2 × 3 = 0 and 2 has</text>
<text x="352" y="284" fill="#e11d48" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" >no inverse — so it is not a field.</text>
</svg>
