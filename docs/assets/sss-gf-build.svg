<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 290" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Building GF(2 to the 8): the field is every degree-less-than-8 polynomial; multiply then reduce modulo the irreducible">
<title>Building GF(2 to the 8): the field is every degree-less-than-8 polynomial; multiply then reduce modulo the irreducible</title>
<rect x="0.5" y="0.5" width="683" height="289" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="start" >Step 4 — build GF(2⁸): multiply, then reduce mod the irreducible</text>
<rect x="72" y="56" width="540" height="40" rx="7" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="86" y="80" fill="#334155" font-size="13" font-weight="700" font-style="normal" text-anchor="start" >the field  =  every polynomial of degree &lt; 8  =  all 2⁸ = 256 bytes</text>
<rect x="60" y="128" width="124" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="122.0" y="150" fill="#334155" font-size="14" font-weight="700" font-style="normal" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0x57 × 0x83</text>
<text x="122.0" y="168" fill="#94a3b8" font-size="10.5" font-weight="600" font-style="normal" text-anchor="middle" >two bytes</text>
<rect x="232" y="128" width="164" height="52" rx="8" fill="#fed7aa" stroke="#d97706" stroke-width="1.4"/>
<text x="314.0" y="150" fill="#334155" font-size="14" font-weight="700" font-style="normal" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">degree ≤ 14</text>
<text x="314.0" y="168" fill="#94a3b8" font-size="10.5" font-weight="600" font-style="normal" text-anchor="middle" >product overflows a byte</text>
<rect x="462" y="128" width="162" height="52" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
<text x="543.0" y="150" fill="#334155" font-size="14" font-weight="700" font-style="normal" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">= 0xc1</text>
<text x="543.0" y="168" fill="#94a3b8" font-size="10.5" font-weight="600" font-style="normal" text-anchor="middle" >remainder, back to a byte</text>
<line x1="186" y1="154.0" x2="230" y2="154.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<text x="208" y="146.0" fill="#334155" font-size="13" font-weight="700" font-style="normal" text-anchor="middle" >×</text>
<line x1="398" y1="154.0" x2="460" y2="154.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<text x="429" y="145.0" fill="#7c3aed" font-size="11" font-weight="700" font-style="normal" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">mod 0x11b</text>
<text x="342.0" y="222" fill="#94a3b8" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" >the remainder modulo the irreducible is the polynomial version of “wrap at p”</text>
<text x="342.0" y="242" fill="#94a3b8" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" >(matches the FIPS 197 worked example; the bit-level reduce is the xtime step, Figure 10)</text>
</svg>
