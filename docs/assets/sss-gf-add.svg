<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 250" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Adding two bytes in GF(2 to the 8) is XOR: a 1 wherever the two bits differ">
<title>Adding two bytes in GF(2 to the 8) is XOR: a 1 wherever the two bits differ</title>
<rect x="0.5" y="0.5" width="485" height="249" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="28" y="36" fill="#334155" font-size="15" font-weight="700" font-style="normal" text-anchor="start">Adding two bytes = XOR (a 1 where the bits differ)</text>
<text x="126" y="82.0" fill="#334155" font-size="13" font-weight="700" font-style="normal" text-anchor="end">0x2A</text>
<rect x="140" y="60" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="160.0" y="81.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">0</text><rect x="180" y="60" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="200.0" y="81.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">0</text><rect x="220" y="60" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="240.0" y="81.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">1</text><rect x="260" y="60" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="280.0" y="81.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">0</text><rect x="300" y="60" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="320.0" y="81.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">1</text><rect x="340" y="60" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="360.0" y="81.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">0</text><rect x="380" y="60" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="400.0" y="81.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">1</text><rect x="420" y="60" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="440.0" y="81.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">0</text><text x="126" y="126.0" fill="#334155" font-size="13" font-weight="700" font-style="normal" text-anchor="end">⊕ 0xF0</text>
<rect x="140" y="104" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="160.0" y="125.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">1</text><rect x="180" y="104" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="200.0" y="125.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">1</text><rect x="220" y="104" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="240.0" y="125.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">1</text><rect x="260" y="104" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="280.0" y="125.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">1</text><rect x="300" y="104" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="320.0" y="125.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">0</text><rect x="340" y="104" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="360.0" y="125.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">0</text><rect x="380" y="104" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="400.0" y="125.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">0</text><rect x="420" y="104" width="40" height="34" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="440.0" y="125.9" fill="#334155" font-size="14" font-weight="normal" text-anchor="middle">0</text><line x1="140" y1="148" x2="460" y2="148" stroke="#cbd5e1" stroke-width="1.3"/><text x="126" y="176.0" fill="#334155" font-size="13" font-weight="700" font-style="normal" text-anchor="end">= 0xDA</text>
<rect x="140" y="154" width="40" height="34" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="160.0" y="176.2" fill="#059669" font-size="15" font-weight="700" text-anchor="middle">1</text><rect x="180" y="154" width="40" height="34" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="200.0" y="176.2" fill="#059669" font-size="15" font-weight="700" text-anchor="middle">1</text><rect x="220" y="154" width="40" height="34" rx="3" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.2"/><text x="240.0" y="176.2" fill="#94a3b8" font-size="15" font-weight="700" text-anchor="middle">0</text><rect x="260" y="154" width="40" height="34" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="280.0" y="176.2" fill="#059669" font-size="15" font-weight="700" text-anchor="middle">1</text><rect x="300" y="154" width="40" height="34" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="320.0" y="176.2" fill="#059669" font-size="15" font-weight="700" text-anchor="middle">1</text><rect x="340" y="154" width="40" height="34" rx="3" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.2"/><text x="360.0" y="176.2" fill="#94a3b8" font-size="15" font-weight="700" text-anchor="middle">0</text><rect x="380" y="154" width="40" height="34" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="400.0" y="176.2" fill="#059669" font-size="15" font-weight="700" text-anchor="middle">1</text><rect x="420" y="154" width="40" height="34" rx="3" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.2"/><text x="440.0" y="176.2" fill="#94a3b8" font-size="15" font-weight="700" text-anchor="middle">0</text><text x="243.0" y="222" fill="#94a3b8" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">no carrying — each column is on its own, so the result is always a byte;</text>
<text x="243.0" y="237" fill="#94a3b8" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">and XORing the same byte again undoes it (so subtraction is the same move)</text>
</svg>
