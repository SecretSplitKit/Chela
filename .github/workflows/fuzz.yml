# Short-budget fuzz check on PRs.
#
# Runs libFuzzer for a short budget against every parser that ingests untrusted input:
# the share-text parser (parse_shares) and the HTML and JSON importers (extract_html,
# extract_json). The point is a fast smoke test — catch a freshly-introduced panic
# before merge, not exhaustively search the input space. A longer run (hours /
# overnight) belongs in the pre-release checklist; see RELEASING.md.
#
# Requires nightly because cargo-fuzz uses unstable rustc flags. Stable runtime users
# never see this dependency — the fuzz crate is excluded from the main workspace.
#
# Third-party actions are pinned to commit SHAs; version tag in trailing comment is
# informational only — update via Dependabot.

name: Fuzz smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  parse_shares:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (Node 24)
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master @ 2026-05
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz targets (30s budget each)
        shell: bash
        run: |
          cd chela-share/fuzz
          for target in parse_shares extract_html extract_json; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=30 \
              -timeout=5 \
              -rss_limit_mb=256
            echo "::endgroup::"
          done
      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (Node 24)
        with:
          name: fuzz-crashes
          path: |
            chela-share/fuzz/artifacts/
            chela-share/fuzz/corpus/
          if-no-files-found: ignore
