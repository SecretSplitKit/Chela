version: 2
updates:
  - package-ecosystem: "cargo"
    # Look for `Cargo.toml` and `Cargo.lock` in the root directory
    directory: "/"
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  # The fuzz harness is a separate workspace (excluded from the root) and holds the only
  # external crates (libfuzzer-sys + its transitive deps); watch it for advisories too.
  - package-ecosystem: "cargo"
    directory: "/chela-share/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
